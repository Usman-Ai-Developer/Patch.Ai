# backend/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Explicit paths: `builder/services/.../writers/tests.py` is generated-code
# scaffolding that uses relative imports, so it must not be collected.
testpaths = assistant/tests builder/tests.py preview/tests.py terminal/tests.py
norecursedirs = env __pycache__ .pytest_cache htmlcov project_workspaces migrations
addopts = --cov=assistant --cov-report=term-missing
